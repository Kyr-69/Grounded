name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli && npm ci

      - name: Export signing config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > grounded.keystore
          echo "storeFile=$(pwd)/grounded.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > src-tauri/gen/android/app/keystore.properties

      - name: Build APK
        run: npm run tauri android build -- --target aarch64

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          generate_release_notes: true
