[package]
name = "grounded"
version = "0.1.0"
description = "Daily routine accountability app — build your routine, check off tasks inside their time windows, never miss one."
authors = ["you"]
edition = "2021"

[lib]
name = "grounded_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
